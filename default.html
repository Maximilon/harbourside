<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<title>{{ page.title | default: site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fafaf7;
    --ink: #1a1a1a;
    --muted: #8a8a85;
    --accent: #d4543a;
    --card: #ffffff;
    --border: #e8e6e0;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 2rem 1.25rem 4rem;
    max-width: 600px;
    margin: 0 auto;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    margin-bottom: 2.5rem;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 2.5rem;
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.875rem;
    margin-bottom: 1.5rem;
    padding: 0.5rem 0;
  }

  .back-link:hover { color: var(--accent); }

  .store-grid {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .store-card, .date-card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem 1.5rem;
    text-decoration: none;
    color: var(--ink);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .store-card:active, .date-card:active {
    transform: scale(0.98);
    border-color: var(--accent);
  }

  .store-name {
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
  }

  .store-meta, .date-meta {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .date-title {
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: 0.2rem;
  }

  .arrow {
    float: right;
    color: var(--muted);
    font-size: 1.2rem;
    margin-top: 0.1rem;
  }

  .content {
    margin-top: 1.5rem;
  }

  .content p { margin: 1rem 0; }
  .content ul { margin: 1rem 0; padding-left: 1.5rem; }
</style>
</head>
<body>
  {{ content }}
</body>
</html>
